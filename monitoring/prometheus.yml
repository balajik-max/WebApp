global:
  scrape_interval: 15s

scrape_configs:
  - job_name: ollama_engines
    static_configs:
      - targets: ["ollama_exporter:9320"]
    scrape_interval: 15s

  - job_name: node
    static_configs:
      - targets: ["node_exporter:9100"]
    scrape_interval: 30s

  - job_name: postgres
    static_configs:
      - targets: ["postgres_exporter:9187"]
    scrape_interval: 30s

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
    scrape_interval: 30s

  - job_name: nginx
    static_configs:
      - targets: ["nginx_exporter:9113"]
    scrape_interval: 30s

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
    scrape_interval: 30s
