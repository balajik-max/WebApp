worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # --- Rate Limiting ---
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    # --- Upstream: 4 App Servers ---
    upstream app_servers {
        least_conn;
        server 192.168.10.94:9000;  # PC2
        server 192.168.10.95:9000;  # PC3
        server 192.168.10.96:9000;  # PC4
        server 192.168.10.97:9000;  # PC5
    }

    # --- Upstream: Database Server ---
    upstream db_server {
        server 192.168.10.98:3001;  # PC6 Grafana
    }

    # --- HTTP → HTTPS redirect ---
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # --- Main HTTPS server ---
    server {
        listen 443 ssl http2;
        server_name 106.51.76.85;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        client_max_body_size 100M;

        # --- App traffic → load balanced backends ---
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://app_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # --- WebSocket support ---
        location /api/ws/ {
            proxy_pass http://app_servers;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
        }

        # --- Frontend (static) → load balanced ---
        location / {
            proxy_pass http://app_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # --- Grafana → DB Server ---
        location /grafana/ {
            proxy_pass http://db_server/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # --- Prometheus → DB Server ---
        location /prometheus/ {
            proxy_pass http://192.168.10.98:9090/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # --- Health check endpoint ---
        location /health {
            proxy_pass http://app_servers/api/v1/health;
            access_log off;
        }
    }
}
