worker_processes 1;
error_log logs/error.log warn;
pid logs/nginx.pid;

events {
    worker_connections 512;
}

http {
    log_format upstream_log '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent" '
        'upstream: $upstream_addr';

    upstream ollama_servers {
        least_conn;
        server 192.168.10.81:11434 max_fails=3 fail_timeout=30s;
        server 192.168.10.67:11434 max_fails=3 fail_timeout=30s;
        server 192.168.10.42:11434 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:11434 weight=2 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 11435;
        access_log logs/access.log upstream_log;

        location / {
            proxy_pass http://ollama_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
        }
    }
}