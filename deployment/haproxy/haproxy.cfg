# haproxy.cfg - Simple HTTP config for testing
# Location: H:\testing webapp\deployment\haproxy\haproxy.cfg

global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5000
    timeout client  50000
    timeout server  50000
    retries 3

# --- Stats Dashboard ---
listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
    stats auth admin:admin123

# --- Frontend (HTTP only for now) ---
frontend http_front
    bind *:8080

    # Route API requests to backend servers
    acl is_api path_beg /api/
    use_backend api_servers if is_api

    # All other requests go to frontend servers
    default_backend frontend_servers

# --- Frontend Servers (React App) ---
backend frontend_servers
    balance roundrobin

    server pc3 192.168.10.67:3000 check
    server pc4 192.168.10.42:3000 check

# --- API Servers (FastAPI Backend) ---
backend api_servers
    balance roundrobin
    option httpchk GET /api/health
    http-check expect status 200

    server pc3 192.168.10.67:8001 check
    server pc4 192.168.10.42:8001 check
