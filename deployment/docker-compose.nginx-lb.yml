# docker-compose.nginx-lb.yml
# Alternative: Use Nginx instead of HAProxy

version: '3.8'

services:
  nginx-lb:
    image: nginx:alpine
    container_name: nginx-loadbalancer
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-lb/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-lb/certs:/etc/nginx/certs:ro
    restart: always
    network_mode: host
